<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architecture Diagram (Orange Theme)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0f0f0f;
      color: #ffa94d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      color: #ff922b;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #2b1406;
      color: #ffd8a8;
      border: 1.5px solid #f76707;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #f76707;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(247, 103, 7, 0.4);
    }
    .diagram-card {
      width: 100%;
      max-width: 1300px;
      background: #141414;
      border: 1.5px solid #e8590c;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    svg {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🔥 Multi-Agent College Recommendation System (Orange Excalidraw)</div>
    <div class="actions">
      <a class="btn" href="college_recommendation_architecture.excalidraw" download="college_recommendation_architecture.excalidraw">📥 Download .excalidraw File</a>
      <button class="btn" onclick="copyExcalidraw()">📋 Copy Excalidraw JSON</button>
      <a class="btn" href="https://excalidraw.com" target="_blank">🌐 Open Excalidraw.com</a>
    </div>
  </div>

  <div class="diagram-card">
    <img src="college_recommendation_architecture.svg" alt="Architecture Diagram" style="width: 100%;">
  </div>

  <script>
    async function copyExcalidraw() {
      try {
        const res = await fetch('college_recommendation_architecture.excalidraw');
        const text = await res.text();
        await navigator.clipboard.writeText(text);
        alert('✅ Excalidraw JSON copied to clipboard! You can now press Ctrl+V directly on excalidraw.com');
      } catch (e) {
        alert('Could not copy automatically: ' + e);
      }
    }
  </script>
</body>
</html>
